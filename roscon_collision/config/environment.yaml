# Positions are measured in the robot root frame (base_link), in meters.
# Rotations are roll, pitch, yaw, in radians. All objects are static.
# The supplied wrist meshes overlap at the zero pose across link_5.
# Remove this explicit demo exclusion if you want to inspect that mesh overlap.
disabled_self_collisions:
  - [link_4, link_6]
objects:
  - name: workbench
    type: box
    size: [0.65, 0.85, 0.55]
    position: [1.15, 0.0, 0.275]
    rpy: [0.0, 0.0, 0.0]
  - name: pillar
    type: cylinder
    radius: 0.12
    length: 1.5
    position: [0.65, 0.65, 0.75]
  - name: ball
    type: sphere
    radius: 0.18
    position: [0.65, -0.65, 1.0]
# Mesh objects use the same loader as the robot. Example:
